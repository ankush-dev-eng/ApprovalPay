name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Verify build
        run: npm run build
        env:
          PAYPAL_CLIENT_ID: "ci_dummy_id"
          PAYPAL_CLIENT_SECRET: "ci_dummy_secret"
          PAYPAL_BASE: "https://api-m.sandbox.paypal.com"
          GEMINI_API_KEY: "ci_dummy_key"
          APP_URL: "http://localhost:3000"

      - name: Secret scan
        run: npm run secret-scan

