<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.8" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="url(#glow)" />

  <!-- Subtle Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- Ambient Light Circles -->
  <circle cx="240" cy="100" r="140" fill="#4F46E5" filter="blur(60px)" opacity="0.15" />
  <circle cx="960" cy="140" r="160" fill="#6366F1" filter="blur(70px)" opacity="0.15" />

  <!-- Main Content Centered -->
  <g transform="translate(600, 120)" text-anchor="middle">
    <!-- Logo Badge -->
    <g transform="translate(-180, -78)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#logoGrad)" />
      <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">AP</text>
    </g>

    <!-- Main Title -->
    <text x="28" y="-36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">ApprovalPay</text>

    <!-- Tagline -->
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#A5B4FC" letter-spacing="2.5">AN AI SHOPPING AGENT THAT CANNOT OVERSPEND</text>

    <!-- Subtitle Text -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" letter-spacing="0.5">Semantic Intent Parsing → Verified Merchant Graph → Deterministic Spending Policy → PayPal Sandbox</text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 68)">
      <!-- Pill 1 -->
      <g transform="translate(-320, 0)">
        <rect x="0" y="0" width="195" height="30" rx="15" fill="url(#pillGrad)" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1" />
        <text x="97" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E0E7FF" text-anchor="middle">🔒 Zero LLM Price Authority</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-105, 0)">
        <rect x="0" y="0" width="210" height="30" rx="15" fill="url(#pillGrad)" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1" />
        <text x="105" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E0E7FF" text-anchor="middle">⚖️ Code-Enforced Spend Caps</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(125, 0)">
        <rect x="0" y="0" width="195" height="30" rx="15" fill="url(#pillGrad)" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1" />
        <text x="97" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E0E7FF" text-anchor="middle">💳 PayPal Sandbox Orders</text>
      </g>
    </g>
  </g>

  <!-- Sleek Bottom Wave -->
  <path d="M0,285 C200,270 400,305 600,290 C800,275 1000,305 1200,290 L1200,320 L0,320 Z" fill="url(#waveGrad)" opacity="0.3" />
  <path d="M0,295 C300,280 500,310 750,295 C950,285 1100,305 1200,300 L1200,320 L0,320 Z" fill="#4F46E5" opacity="0.6" />
</svg>

